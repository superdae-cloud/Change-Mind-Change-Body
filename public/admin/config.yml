backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

# Lets you test the CMS locally with `npx decap-server` running alongside `npm run dev`,
# without needing Netlify Identity/Git Gateway configured yet.
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

logo_url: /images/brand-badge.png

collections:
  - name: "tips_exercise"
    label: "Tips — Exercise"
    folder: "src/content/tips/exercise"
    create: true
    slug: "{{slug}}"
    preview_path: "exercise"
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Pillar", name: "pillar", widget: "hidden", default: "exercise" }
      - { label: "Summary", name: "summary", widget: "string", pattern: ["^.{1,200}$", "Must be 200 characters or fewer"] }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tags", name: "tags", widget: "list", required: false, default: [] }
      - { label: "Featured", name: "featured", widget: "boolean", required: false, default: false }
      - { label: "Draft", name: "draft", widget: "boolean", required: false, default: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "tips_diet"
    label: "Tips — Diet"
    folder: "src/content/tips/diet"
    create: true
    slug: "{{slug}}"
    preview_path: "diet"
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Pillar", name: "pillar", widget: "hidden", default: "diet" }
      - { label: "Summary", name: "summary", widget: "string", pattern: ["^.{1,200}$", "Must be 200 characters or fewer"] }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tags", name: "tags", widget: "list", required: false, default: [] }
      - { label: "Featured", name: "featured", widget: "boolean", required: false, default: false }
      - { label: "Draft", name: "draft", widget: "boolean", required: false, default: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "tips_supplements"
    label: "Tips — Supplements"
    folder: "src/content/tips/supplements"
    create: true
    slug: "{{slug}}"
    preview_path: "supplements"
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Pillar", name: "pillar", widget: "hidden", default: "supplements" }
      - { label: "Summary", name: "summary", widget: "string", pattern: ["^.{1,200}$", "Must be 200 characters or fewer"] }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tags", name: "tags", widget: "list", required: false, default: [] }
      - { label: "Featured", name: "featured", widget: "boolean", required: false, default: false }
      - { label: "Draft", name: "draft", widget: "boolean", required: false, default: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "tips_mental_health"
    label: "Tips — Mental Health"
