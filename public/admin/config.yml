  - name: "tips_bro_science"
    label: "Tips — Bro Science"
    folder: "src/content/tips/bro-science"
    create: true
    slug: "{{slug}}"
    preview_path: "bro-science"
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Pillar", name: "pillar", widget: "hidden", default: "bro-science" }
      - { label: "Summary", name: "summary", widget: "string", pattern: ["^.{1,200}$", "Must be 200 characters or fewer"] }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tags", name: "tags", widget: "list", required: false, default: [] }
      - { label: "Featured", name: "featured", widget: "boolean", required: false, default: false }
      - { label: "Draft", name: "draft", widget: "boolean", required: false, default: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pillars"
    label: "Pillar Cards"
    files:
      - label: "Pillars"
        name: "pillars"
        file: "src/data/pillars.json"
        preview_path: ""
        fields:
          - name: "pillars"
            label: "Pillars"
            widget: "list"
            min: 6
            max: 6
            summary: "{{fields.title}}"
            fields:
              - { label: "Slug", name: "slug", widget: "select", options: ["exercise", "diet", "supplements", "mental-health", "immune-health", "bro-science"] }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Emoji", name: "emoji", widget: "string" }
              - { label: "Blurb", name: "blurb", widget: "string" }
              - { label: "Color", name: "color", widget: "color" }

  - name: "pages"
    label: "Page Copy"
    files:
      - label: "Home Page"
        name: "home"
        file: "src/content/pages/home.json"
        preview_path: ""
        fields:
          - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Hero Button Label", name: "heroButtonLabel", widget: "string" }
          - { label: "Mission Eyebrow", name: "missionEyebrow", widget: "string" }
          - { label: "Mission Heading", name: "missionHeading", widget: "string" }
          - { label: "Mission Body", name: "missionBody", widget: "text" }
          - { label: "Mission Button Label", name: "missionButtonLabel", widget: "string" }
          - { label: "Pillars Eyebrow", name: "pillarsEyebrow", widget: "string" }
          - { label: "Pillars Heading", name: "pillarsHeading", widget: "string" }
          - { label: "Recent Picks Eyebrow", name: "recentPicksEyebrow", widget: "string" }
          - { label: "Recent Picks Heading", name: "recentPicksHeading", widget: "string" }
          - { label: "Ask Eyebrow", name: "askEyebrow", widget: "string" }
          - { label: "Ask Heading", name: "askHeading", widget: "string" }
      - label: "About Page"
        name: "about"
        file: "src/content/pages/about.json"
        preview_path: "about"
        fields:
          - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Why Eyebrow", name: "whyEyebrow", widget: "string" }
          - { label: "Why Heading", name: "whyHeading", widget: "string" }
          - { label: "Why Paragraph 1", name: "whyParagraph1", widget: "text" }
          - { label: "Why Paragraph 2", name: "whyParagraph2", widget: "text" }
          - { label: "Free Eyebrow", name: "freeEyebrow", widget: "string" }
          - { label: "Free Heading", name: "freeHeading", widget: "string" }
          - { label: "Free Paragraph", name: "freeParagraph", widget: "text" }
          - { label: "Pillars Eyebrow", name: "pillarsEyebrow", widget: "string" }
          - { label: "Pillars Heading", name: "pillarsHeading", widget: "string" }
          - { label: "Closing Heading", name: "closingHeading", widget: "string" }
          - { label: "Closing Paragraph", name: "closingParagraph", widget: "text" }
