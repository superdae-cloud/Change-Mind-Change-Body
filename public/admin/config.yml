  - name: "tips_immune_health"
    label: "Tips — Immune Health"
    folder: "src/content/tips/immune-health"
    create: true
    slug: "{{slug}}"
    preview_path: "immune-health"
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Pillar", name: "pillar", widget: "hidden", default: "immune-health" }
      - { label: "Summary", name: "summary", widget: "string", pattern: ["^.{1,200}$", "Must be 200 characters or fewer"] }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
